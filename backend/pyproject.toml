[project]
name = "meshtomod"
version = "0.0.1"
description = "Turn scanned meshes into editable, feature-based STEP solids"
requires-python = ">=3.11,<3.13"
dependencies = [
    "cadquery>=2.4",
    "trimesh>=4.0",
    "numpy>=1.26",
    "scipy>=1.11",
    "networkx>=3.0",
    "lxml>=5.0",
    "rtree>=1.2",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "python-multipart>=0.0.9",
    "fast-simplification>=0.1.7",
    "shapely>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.5", "manifold3d>=2.4"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["meshtomod*"]

[tool.setuptools.package-data]
"meshtomod.cad" = ["*.fs"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.File"]
